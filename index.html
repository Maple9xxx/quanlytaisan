<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1226"><meta name="mobile-web-app-capable" content="yes">
<title>Quản Lý Tài Sản</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E1226;--c1:#181D3A;--c2:#272F5E;--tx:#F2F4FF;--mu:#8D95C4;--in:#2BD9A0;--ex:#FF6B7A;--go:#FFC857;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font:500 14px 'Be Vietnam Pro',system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
#app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 0}
header h1{margin:0;font-size:17px;font-weight:800}
#ib{background:var(--go);color:#1a1530;border:0;border-radius:20px;padding:7px 12px;font-weight:700;font-size:12px}
#mn{display:flex;align-items:center;justify-content:center;gap:14px;padding:6px}
#mn button{background:var(--c1);border:0;border-radius:50%;width:32px;height:32px;font-size:18px}
#mo{min-width:120px;text-align:center;font-weight:700}
main{flex:1;min-height:0}
.v{display:none;height:100%;padding:0 14px 10px;flex-direction:column;gap:10px}.v.on{display:flex}
.seg{display:flex;background:var(--c1);border-radius:14px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:8px;border-radius:11px}
.seg button.on{background:var(--c2);color:var(--tx)}
.hero small{color:var(--mu)}#bal{display:block;font-size:34px;font-weight:800;letter-spacing:-.02em}
.chips{display:flex;gap:8px;margin-top:4px}.chips span{background:var(--c1);padding:5px 10px;border-radius:20px;font-size:12px;color:var(--mu)}
.chips .in b{color:var(--in)}.chips .ex b{color:var(--ex)}
#stage{flex:1;min-height:0;position:relative;touch-action:none}
#cv{width:100%;height:100%;display:block}
#ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;line-height:1.35}
#ctr.t{top:4px;transform:translateX(-50%)}#ctr b{display:block;font-size:17px}#ctr small{color:var(--mu)}
#lbl span{position:absolute;transform:translateX(-50%);font-size:12px;color:var(--mu);pointer-events:none}
#leg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}#leg.b{grid-template-columns:1fr 1fr}
#leg button{background:var(--c1);border:2px solid transparent;border-radius:12px;font-size:11px;padding:5px 2px;display:flex;flex-direction:column;align-items:center}
#leg button.on{border-color:var(--go)}#leg button span{font-size:17px}
.k{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--mu);padding:12px 0}.k i{width:10px;height:10px;border-radius:3px}
.fld{background:var(--c1);border:0;border-radius:14px;padding:12px 14px;width:100%;font-size:16px}
#rows{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.r{display:flex;align-items:center;gap:10px;background:var(--c1);border-radius:14px;padding:0 12px;height:52px;flex:none}
.r div{flex:1;min-width:0}.r b,.r small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.r small{color:var(--mu);font-size:11px}
.ei{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:18px}
.r em{font-style:normal;font-weight:700}em.e{color:var(--ex)}em.i{color:var(--in)}
.em{text-align:center;color:var(--mu);margin:auto;line-height:1.6}
#pg{display:flex;justify-content:center;align-items:center;gap:18px}#pg button{background:var(--c1);border:0;border-radius:50%;width:34px;height:34px;font-size:18px}
#bt{background:var(--c1);border-radius:16px;padding:12px;color:var(--mu);display:flex;flex-direction:column;gap:8px}#bt div:first-child{display:flex;justify-content:space-between;color:var(--tx)}
#bg{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:8px}
.bc{background:var(--c1);border:0;border-radius:16px;padding:10px;text-align:left;display:flex;flex-direction:column;justify-content:space-between}.bc small{color:var(--mu)}
.bar{height:6px;background:var(--c2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;transition:width .4s}
#st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}#st div{background:var(--c1);border-radius:14px;padding:10px}#st small{display:block;color:var(--mu);font-size:11px;margin-bottom:2px}#st b{font-size:15px}
.mb{flex:1;background:var(--c1);border:0;border-radius:16px;padding:0 14px;text-align:left;display:flex;gap:12px;align-items:center}.mb span{font-size:22px}
.mb.p{background:var(--go);color:#1a1530;font-weight:700}
nav{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:6px 8px 8px;background:var(--c1);border-radius:22px 22px 0 0}
nav button{background:none;border:0;color:var(--mu);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:20px}nav button.on{color:var(--tx)}
nav .fab{width:54px;height:54px;border-radius:50%;background:var(--go);color:#1a1530;font-size:30px;font-weight:800;margin:-28px auto 0;justify-content:center;box-shadow:0 6px 18px #FFC85766}
#ov{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:opacity .2s}#ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:480px;transform:translate(-50%,105%);transition:transform .25s;background:var(--c1);border-radius:24px 24px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;max-height:96%;overflow-y:auto}
.sheet.on{transform:translate(-50%,0)}.sheet .seg{background:var(--bg)}
#amt{font-size:34px;font-weight:800;text-align:center}
#cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#cats button{background:var(--c2);border:2px solid transparent;border-radius:12px;font-size:11px;padding:6px 2px;display:flex;flex-direction:column;align-items:center}#cats button.on{border-color:var(--go)}#cats span{font-size:18px}
#kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}#kp button{background:var(--c2);border:0;border-radius:12px;font-size:19px;font-weight:700;height:42px}
.row{display:flex;gap:8px}.row>*{flex:1}.row button{border:0;border-radius:14px;height:46px;background:var(--c2)}.row .pri{background:var(--go);color:#1a1530;font-weight:800}
#sh.b .tx{display:none}#sh:not(.b) #ttl{display:none}#ttl{text-align:center;font-weight:700}
#ta{height:200px;resize:none;background:var(--bg);border:0;border-radius:12px;padding:10px;font-size:12px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--c2);padding:10px 14px;border-radius:14px;width:max-content;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}#toast.on{opacity:1;pointer-events:auto}
#toast button{background:none;border:0;color:var(--go);font-weight:700}
</style></head><body>
<div id="app">
<header><h1>Quản Lý Tài Sản</h1><button id="ib">⬇ Cài về máy</button></header>
<div id="mn"><button id="prv">‹</button><button id="mo"></button><button id="nxt">›</button></div>
<main>
<section class="v on"><div class="hero"><small id="hd"></small><b id="bal"></b><div id="hs" class="chips"></div><div id="pd"><small id="pl2"></small><div class="chips"><span class="in">Thu <b id="si"></b></span><span class="ex">Chi <b id="se"></b></span><span id="dn"></span></div></div><div hidden><span id="pl"></span></div></div>
<div class="seg" id="mode"><button class="on" data-m="0">Theo danh mục</button><button data-m="1">6 tháng</button></div>
<div id="stage"><canvas id="cv"></canvas><div id="ctr"></div><div id="lbl"></div></div><div id="leg"></div></section>
<section class="v"><input id="q" class="fld" placeholder="Tìm theo ghi chú, danh mục…"><div class="seg" id="ft"><button class="on" data-f="">Tất cả</button><button data-f="e">Chi</button><button data-f="i">Thu</button></div>
<div id="rows"></div><div id="pg"><button id="pp">‹</button><span id="pn"></span><button id="px">›</button></div></section>
<section class="v"><div id="bt"></div><div id="bg"></div></section>
<section class="v"><div id="st"></div><button class="mb p" id="ins"><span>📲</span>Cài ứng dụng về máy</button><button class="mb" id="bk"><span>💾</span>Sao lưu / Khôi phục</button><button class="mb" id="cs"><span>📊</span>Xuất bảng CSV</button><button class="mb" id="rs0"><span>🗑️</span>Xóa toàn bộ dữ liệu</button></section>
</main>
<nav><button data-g="0" class="on"><i>🍩</i>Tổng quan</button><button data-g="1"><i>🧾</i>Giao dịch</button><button class="fab" id="add">+</button><button data-g="2"><i>🎯</i>Ngân sách</button><button data-g="3"><i>⚙️</i>Thêm</button></nav>
</div>
<div id="ov"></div>
<div class="sheet" id="sh"><div id="ttl"></div><div class="seg tx" id="ty"><button data-t="e" class="on">Chi tiêu</button><button data-t="i">Thu nhập</button></div><div id="amt"></div><div id="cats" class="tx"></div>
<div class="row tx"><input id="nt" class="fld" placeholder="Ghi chú"><input id="dt" class="fld" type="date"></div><div id="kp"></div>
<div class="row"><button id="del">Xóa</button><button id="sv" class="pri">Lưu</button></div></div>
<div class="sheet" id="dm"><div id="dtl" style="text-align:center;font-weight:700"></div><textarea id="ta"></textarea><div class="row"><button id="cp">Sao chép</button><button id="rs" class="pri">Khôi phục từ ô này</button></div></div>
<div class="sheet" id="pk"><div style="text-align:center;font-weight:700">Chọn thời gian</div>
<div class="yr"><button id="y1">‹</button><b id="yl"></b><button id="y2">›</button><button id="yall">Cả năm</button></div><div id="pmg"></div>
<div style="color:var(--mu);font-size:12px">Hoặc chọn khoảng ngày bất kỳ</div><div class="row"><input id="cf" class="fld" type="date"><input id="ct" class="fld" type="date"></div>
<div class="row"><button class="pri" id="ca">Áp dụng</button></div></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const EC=[['Ăn uống','🍜','#FF8A5B'],['Di chuyển','🛵','#4DA8FF'],['Mua sắm','🛍️','#F26CA7'],['Nhà ở','🏠','#9B7BFF'],['Giải trí','🎮','#FFC857'],['Sức khỏe','💊','#2BD9A0'],['Học tập','📚','#5CE1E6'],['Khác','🧾','#9AA3C7']];
const IC=[['Lương','💼'],['Thưởng','🎁'],['Bán hàng','🏷️'],['Khác','💰']];
let D={tx:[],bud:{}};try{D=JSON.parse(localStorage.getItem('qlct'))||D}catch(e){}
const save=()=>{try{localStorage.setItem('qlct',JSON.stringify(D))}catch(e){}};
const now=new Date();let Y=now.getFullYear(),M=now.getMonth(),tab=0,mode=0,sel=-1,q='',flt='',pg=0,ps=6,BM=[];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmt=n=>Math.round(n).toLocaleString('vi-VN')+'đ';
const sk=n=>n>=1e6?+(n/1e6).toFixed(1)+'tr':n>=1e3?Math.round(n/1e3)+'k':Math.round(n)+'';
const esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const _n=new Date(),_s=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let P={k:'m',f:_s(new Date(_n.getFullYear(),_n.getMonth(),1)),t:_s(new Date(_n.getFullYear(),_n.getMonth()+1,0))};
const mtx=(y,m)=>y==null?D.tx.filter(t=>t.d>=P.f&&t.d<=P.t):D.tx.filter(t=>t.d.startsWith(y+'-'+String(m+1).padStart(2,'0')));
const sum=(T,t)=>T.filter(x=>x.t==t).reduce((a,x)=>a+x.a,0);
function stats(){const T=mtx(),by=EC.map(()=>0);T.forEach(t=>t.t=='e'&&(by[t.c]+=t.a));return{T,i:sum(T,'i'),e:sum(T,'e'),by}}
let tt;function toast(m,u){const e=$('#toast');e.innerHTML=m+(u?' <button id="un">Hoàn tác</button>':'');e.classList.add('on');if(u)$('#un').onclick=()=>{u();e.classList.remove('on')};clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),m.length*55+2200)}
/* ---------- 3D ---------- */
const stage=$('#stage'),cv=$('#cv');let R;
try{R=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2))}catch(e){stage.insertAdjacentHTML('beforeend','<p class="em">Thiết bị không hỗ trợ 3D</p>')}
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,.1,100),G=new THREE.Group();
sc.add(G,new THREE.AmbientLight(0xffffff,.75));const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(3,8,5);sc.add(dl);
function size(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h||!R)return;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
new ResizeObserver(()=>{size();build3D(stats())}).observe(stage);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.4,metalness:.15});
function build3D(s){if(!R)return;
 G.children.slice().forEach(o=>{o.geometry.dispose();G.remove(o)});
 const c=$('#ctr'),lb=$('#lbl');lb.innerHTML='';c.className=mode?'t':'';
 if(!mode){cam.position.set(0,6.6,5.4);cam.lookAt(0,0,0);
  if(!s.e){const m=new THREE.Mesh(new THREE.TorusGeometry(2.1,.35,16,48),mat('#2A3163'));m.rotation.x=Math.PI/2;G.add(m);c.innerHTML='<b>Chưa có khoản chi</b><small>Bấm + để thêm</small>'}
  else{let a=0;if(sel>=0&&!s.by[sel])sel=-1;
   s.by.forEach((v,i)=>{if(!v)return;const b=a+v/s.e*6.2832,h=(a+b)/2,g=Math.min(.02,(b-a)/4),sp=new THREE.Shape();
    sp.absarc(0,0,2.7,a+g,b-g,false);sp.absarc(0,0,1.5,b-g,a+g,true);
    const m=new THREE.Mesh(new THREE.ExtrudeGeometry(sp,{depth:.7,bevelEnabled:false,curveSegments:24}),mat(EC[i][2]));
    m.rotation.x=-1.5708;m.userData.k=i;if(i==sel)m.position.set(Math.cos(h)*.3,.2,-Math.sin(h)*.3);G.add(m);a=b});
   c.innerHTML=sel>=0?`<small>${EC[sel][1]} ${EC[sel][0]}</small><b>${fmt(s.by[sel])}</b><small>${Math.round(s.by[sel]/s.e*100)}%</small>`:`<small>Tổng chi</small><b>${fmt(s.e)}</b>`}
 }else{cam.position.set(0,5.2,9.5);cam.lookAt(0,1,0);cam.updateMatrixWorld();G.rotation.y=0;BM=[];
  for(let k=5;k>=0;k--){const d=new Date(Y,M-k,1),T=mtx(d.getFullYear(),d.getMonth());BM.push({n:d.getMonth()+1,i:sum(T,'i'),e:sum(T,'e')})}
  const mx=Math.max(1,...BM.flatMap(m=>[m.i,m.e])),fl=new THREE.Mesh(new THREE.BoxGeometry(9,.1,1.8),mat('#1B2147'));fl.position.y=-.05;G.add(fl);
  BM.forEach((m,k)=>{const x=(k-2.5)*1.5;[[m.i,'#2BD9A0',-.3],[m.e,'#FF6B7A',.3]].forEach(([v,col,o])=>{const h=Math.max(.06,v/mx*3.6),b=new THREE.Mesh(new THREE.BoxGeometry(.5,h,.5),mat(col));b.position.set(x+o,h/2,0);b.userData.k=k;G.add(b)});
   const p=new THREE.Vector3(x,0,1.2).project(cam);lb.innerHTML+=`<span style="left:${(p.x+1)/2*stage.clientWidth}px;top:${(1-p.y)/2*stage.clientHeight}px">T${m.n}</span>`});
  c.innerHTML='<small>Chạm vào cột để xem chi tiết</small>'}}
function pick(k){if(mode){const m=BM[k];if(m)$('#ctr').innerHTML=`<b>Tháng ${m.n}</b><small>Thu ${fmt(m.i)}, chi ${fmt(m.e)}</small>`;return}sel=k==sel?-1:k;r3()}
function r3(){const s=stats();build3D(s);rLeg(s)}
let dr=0,px0,pm=0;
cv.onpointerdown=e=>{px0=e.clientX;pm=0;dr=1;cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(!dr)return;const d=e.clientX-px0;px0=e.clientX;pm+=Math.abs(d);if(!mode)G.rotation.y+=d*.012};
cv.onpointerup=e=>{dr=0;if(pm>6)return;const r=cv.getBoundingClientRect(),rc=new THREE.Raycaster();rc.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),cam);
 const h=rc.intersectObjects(G.children)[0];pick(h&&h.object.userData.k!=null?h.object.userData.k:-1)};
(function L(){requestAnimationFrame(L);if(tab||!R)return;if(!mode&&!dr&&sel<0)G.rotation.y+=.004;R.render(sc,cam)})();
/* ---------- Giao diện ---------- */
function rLeg(s){const L=$('#leg');L.className=mode?'b':'';
 L.innerHTML=mode?'<div class="k"><i style="background:var(--in)"></i>Thu nhập</div><div class="k"><i style="background:var(--ex)"></i>Chi tiêu</div>':EC.map((c,i)=>`<button data-i="${i}" class="${sel==i?'on':''}" style="opacity:${s.by[i]?1:.4}"><span>${c[1]}</span>${s.e&&s.by[i]?Math.round(s.by[i]/s.e*100)+'%':'–'}</button>`).join('')}
$('#leg').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.i!=null&&stats().by[+b.dataset.i])pick(+b.dataset.i)};
$$('#mode button').forEach(b=>b.onclick=()=>{mode=+b.dataset.m;sel=-1;G.rotation.y=0;$$('#mode button').forEach(x=>x.classList.toggle('on',x==b));size();r3()});
const row=t=>{const c=(t.t=='e'?EC:IC)[t.c],col=t.t=='e'?EC[t.c][2]:'#2BD9A0',dd=t.d.split('-');return`<div class="r" data-id="${t.id}"><span class="ei" style="background:${col}33">${c[1]}</span><div><b>${esc(t.n||c[0])}</b><small>${t.n?c[0]+', ':''}${dd[2]}/${dd[1]}</small></div><em class="${t.t}">${t.t=='e'?'-':'+'}${sk(t.a)}</em></div>`};
function rList(){if(tab==1){const h=$('#rows').clientHeight;if(h)ps=Math.max(3,Math.floor((h+6)/58))}
 let l=q?D.tx.filter(t=>(t.n+' '+(t.t=='e'?EC:IC)[t.c][0]).toLowerCase().includes(q)):mtx();if(flt)l=l.filter(t=>t.t==flt);
 l.sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);const n=Math.max(1,Math.ceil(l.length/ps));pg=Math.min(pg,n-1);
 $('#rows').innerHTML=l.slice(pg*ps,pg*ps+ps).map(row).join('')||'<p class="em">Chưa có giao dịch nào.<br>Bấm nút + để thêm khoản đầu tiên.</p>';$('#pn').textContent=(pg+1)+' / '+n}
$('#pp').onclick=()=>{pg=Math.max(0,pg-1);rList()};$('#px').onclick=()=>{pg++;rList()};
$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();pg=0;rList()};
$$('#ft button').forEach(b=>b.onclick=()=>{flt=b.dataset.f;pg=0;$$('#ft button').forEach(x=>x.classList.toggle('on',x==b));rList()});
$('#rows').onclick=e=>{const r=e.target.closest('.r');r&&openTx(+r.dataset.id)};
function rBud(s){const ks=Object.keys(D.bud),tb=ks.reduce((a,k)=>a+D.bud[k],0),ts=ks.reduce((a,k)=>a+s.by[k],0);
 $('#bt').innerHTML=tb?`<div><span>Đã chi ${fmt(ts)} / ${fmt(tb)}</span><b>${Math.round(ts/tb*100)}%</b></div><div class="bar"><i style="width:${Math.min(100,ts/tb*100)}%;background:${ts>tb?'var(--ex)':'var(--go)'}"></i></div>`:'Chạm vào một danh mục để đặt giới hạn chi cho mỗi tháng.';
